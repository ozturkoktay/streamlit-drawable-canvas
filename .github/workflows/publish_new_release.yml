name: Update frontend build assets

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install and build frontend
        run: |
          cd streamlit_drawable_canvas/frontend
          npm ci
          npm run build

      - name: Commit updated build directory
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT2 }}
        run: |
          if git status --short | grep "streamlit_drawable_canvas/frontend/build"; then
            git add streamlit_drawable_canvas/frontend/build
            git commit -m "CI: update frontend build"
            git push
          else
            echo "No changes in build directory; skipping commit"
          fi
